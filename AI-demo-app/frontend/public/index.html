<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff69b4" />
    <meta
      name="description"
      content="KatGPT - Ask questions about cats powered by AI"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>KatGPT - Cat Q&A AI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Fredoka', cursive;
        background: linear-gradient(45deg, #ff69b4, #ff1493, #ff69b4);
        background-size: 400% 400%;
        animation: gradientShift 3s ease infinite;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      /* Floating particles animation */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
      
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: float 6s infinite linear;
      }
      
      @keyframes float {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }
      
      /* Sparkle effects */
      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        animation: sparkle 2s infinite;
      }
      
      @keyframes sparkle {
        0%, 100% { opacity: 0; transform: scale(0); }
        50% { opacity: 1; transform: scale(1); }
      }
      
      /* Rainbow border animation */
      .rainbow-border {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border: 4px solid transparent;
        background: linear-gradient(45deg, #ff69b4, #ff1493, #ff69b4, #ff1493, #ff69b4) border-box;
        background-clip: border-box;
        animation: rainbow-border 3s linear infinite;
        pointer-events: none;
        z-index: 5;
      }
      
      @keyframes rainbow-border {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      
      /* Floating cat emojis */
      .floating-emoji {
        position: fixed;
        font-size: 2rem;
        animation: float-emoji 8s infinite linear;
        pointer-events: none;
        z-index: 2;
      }
      
      @keyframes float-emoji {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Rainbow border -->
    <div class="rainbow-border"></div>
    
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>
    
    <script>
      // Create floating particles
      function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.left = Math.random() * 100 + '%';
          particle.style.animationDelay = Math.random() * 6 + 's';
          particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
          particlesContainer.appendChild(particle);
        }
      }
      
      // Create sparkle effects
      function createSparkles() {
        const sparkleCount = 20;
        
        for (let i = 0; i < sparkleCount; i++) {
          const sparkle = document.createElement('div');
          sparkle.className = 'sparkle';
          sparkle.style.left = Math.random() * 100 + '%';
          sparkle.style.top = Math.random() * 100 + '%';
          sparkle.style.animationDelay = Math.random() * 2 + 's';
          document.body.appendChild(sparkle);
        }
      }
      
      // Create floating cat emojis
      function createFloatingEmojis() {
        const emojis = ['🐱', '🐾', '😸', '😺', '😻', '🙀', '😿', '😾'];
        const emojiCount = 15;
        
        for (let i = 0; i < emojiCount; i++) {
          const emoji = document.createElement('div');
          emoji.className = 'floating-emoji';
          emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          emoji.style.left = Math.random() * 100 + '%';
          emoji.style.animationDelay = Math.random() * 8 + 's';
          emoji.style.animationDuration = (Math.random() * 4 + 6) + 's';
          document.body.appendChild(emoji);
        }
      }
      
      // Initialize effects
      createParticles();
      createSparkles();
      createFloatingEmojis();
    </script>
  </body>
</html>
